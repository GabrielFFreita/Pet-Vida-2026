name: petvida2026

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: petvida2026-app:local
    container_name: petvida2026-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: "${DB_HOST:?Defina DB_HOST no arquivo .env}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:?Defina DB_NAME no arquivo .env}"
      DB_USER: "${DB_USER:?Defina DB_USER no arquivo .env}"
      DB_PASSWORD_FILE: /run/secrets/db_password
      APP_DEBUG: "${APP_DEBUG:-0}"
    secrets:
      - db_password
    volumes:
      - ./uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === 'ok' ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt
